name: build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  notes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const rels = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            for (const r of rels) {
              if (r.body) {
                await github.rest.repos.updateRelease({ owner, repo, release_id: r.id, body: '' });
              }
            }

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = \"(.+)\"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; }
          & $nsis /V2 "/DVERSION=$version" installer/island.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Copy-Item src-tauri/target/release/mazey.exe dist/Mazey-Portable.exe
          New-Item -ItemType Directory -Force dist/zip | Out-Null
          Copy-Item src-tauri/target/release/mazey.exe dist/zip/Mazey.exe
          Copy-Item LICENSE, README.md dist/zip/
          Compress-Archive -Path dist/zip/* -DestinationPath dist/Mazey-Windows.zip
          Remove-Item -Recurse dist/zip
          @{ version = $version; published = (Get-Date).ToUniversalTime().ToString('o') } | ConvertTo-Json | Set-Content dist/latest.json -Encoding utf8NoBOM
          "VERSION=$version" >> $env:GITHUB_ENV
          Get-ChildItem dist | Format-Table Name, Length

      - name: Sign the installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MAZEY_SIGN_KEY: ${{ secrets.MAZEY_SIGN_KEY }}
        shell: pwsh
        run: |
          if (-not $env:MAZEY_SIGN_KEY) { throw "MAZEY_SIGN_KEY secret is missing; unsigned releases are not published" }
          node installer/sign.mjs dist/Mazey-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Mazey-Windows-${{ env.VERSION }}
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: مازی ${{ env.VERSION }}
          body: ''
          files: dist/*
